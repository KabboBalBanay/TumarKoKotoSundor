<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ক কত সুন্দর</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
    :root{
        --paper: #FBF4E3;
        --ink: #1C1B1F;
        --red: #E0362E;
        --blue: #2F5FC4;
        --tape: rgba(255, 210, 80, 0.55);
    }
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{
        min-height: 100vh;
        background: var(--blue);
        background-image:
            radial-gradient(circle at 15% 20%, rgba(255,255,255,0.06) 0, transparent 40%),
            radial-gradient(circle at 85% 80%, rgba(255,255,255,0.06) 0, transparent 40%);
        font-family: -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 16px 60px;
    }

    h1{
        font-family: 'Baloo Da 2', 'Segoe UI', sans-serif;
        font-size: 34px;
        color: #fff;
        text-align: center;
        margin: 10px 0 4px;
        text-shadow: 3px 3px 0 rgba(0,0,0,0.15);
    }
    .subtitle{
        color: rgba(255,255,255,0.85);
        font-size: 14px;
        text-align: center;
        margin-bottom: 26px;
    }

    .card{
        position: relative;
        width: min(360px, 100%);
        background: var(--paper);
        border: 3px solid var(--ink);
        border-radius: 10px;
        box-shadow: 7px 7px 0 var(--ink);
        transform: rotate(-1.1deg);
        padding: 26px 22px 22px;
    }
    .card::before{
        content: "";
        position: absolute;
        top: -16px; left: 50%;
        width: 84px; height: 26px;
        background: var(--tape);
        border: 1px solid rgba(0,0,0,0.1);
        transform: translateX(-50%) rotate(-3deg);
        box-shadow: 0 2px 3px rgba(0,0,0,0.15);
    }

    #canvasBox{
        border: 3px solid var(--ink);
        border-radius: 6px;
        overflow: hidden;
    }
    .canvas-stack{
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        display: block;
    }
    .canvas-stack canvas{
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        display: block;
    }
    #paperCanvas{
        pointer-events: none;
    }
    #drawCanvas{
        touch-action: none;
        cursor: crosshair;  
    }

    .controls{
        display: flex;
        gap: 14px;
        margin-top: 22px;
    }
    .btn{
        flex: 1;
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        padding: 13px 10px;
        background: #fff;
        color: var(--ink);
        border: 3px solid var(--ink);
        border-radius: 8px;
        box-shadow: 4px 4px 0 var(--ink);
        cursor: pointer;
        transition: transform .08s ease, box-shadow .08s ease;
    }
    .btn:hover{ filter: brightness(0.97); }
    .btn:active{
        transform: translate(4px, 4px);
        box-shadow: 0 0 0 var(--ink);
    }
    .btn-primary{
        background: var(--red);
        color: #fff;
    }

    #hint{
        margin-top: 12px;
        font-size: 13px;
        color: var(--ink);
        opacity: 0.75;
        text-align: center;
        min-height: 16px;
        font-weight: 600;
    }

    .result-card{
        display: none;
        width: min(360px, 100%);
        background: var(--paper);
        border: 3px solid var(--ink);
        border-radius: 10px;
        box-shadow: 7px 7px 0 var(--ink);
        transform: rotate(1.3deg);
        padding: 34px 26px 26px;
        text-align: center;
        position: relative;
        animation: popIn 0.32s ease-out;
    }
    .result-card::before{
        content: "";
        position: absolute;
        top: -16px; left: 50%;
        width: 84px; height: 26px;
        background: var(--tape);
        border: 1px solid rgba(0,0,0,0.1);
        transform: translateX(-50%) rotate(2deg);
        box-shadow: 0 2px 3px rgba(0,0,0,0.15);
    }
    @keyframes popIn{
        0%   { transform: rotate(1.3deg) scale(0.85); opacity: 0; }
        60%  { transform: rotate(1.3deg) scale(1.04); opacity: 1; }
        100% { transform: rotate(1.3deg) scale(1); }
    }

    .result-eyebrow{
        font-size: 12px;
        letter-spacing: 1px;
        color: var(--ink);
        opacity: 0.55;
        text-transform: uppercase;
        margin-bottom: 10px;
    }
    #rankLabel{
        font-family: 'Baloo Da 2', 'Segoe UI', sans-serif;
        font-size: 30px;
        color: var(--red);
        line-height: 1.3;
    }
    .squiggle{
        width: 90px;
        margin: 10px auto 4px;
        display: block;
    }
    #closestStyle{
        font-size: 12px;
        color: var(--ink);
        opacity: 0.5;
        margin-top: 6px;
    }
    #retryBtn{
        margin-top: 22px;
        width: 100%;
    }

    .offscreen{ display: none; }

    .site-watermark{
        position: fixed;
        bottom: 14px;
        right: 14px;
        width: 64px;
        height: 64px;
        opacity: 0.55;
        transform: rotate(-6deg);
        pointer-events: none;
        z-index: 50;
        filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
    }
    .site-watermark img{
        width: 100%;
        height: 100%;
        display: block;
    }
    @media (max-width: 420px){
        .site-watermark{
            width: 48px;
            height: 48px;
            bottom: 10px;
            right: 10px;
        }
    }
</style>
</head>

    <h1>তোমার "ক" কত সুন্দর?</h1>

<script>
    const LETTER = 'ক';

        { name: 'Hind Siliguri',      css: '"Hind Siliguri"',      weight: '600' },

    const DECOY_FONTS = [

        { min: 0.73, label: 'চমৎকার!' },
        { min: 0.82, label: 'অসাধারণ ভাই  অসাধারণ ✨' },
        { min: 0.90, label: 'আপনার হাতে চুমু দেই ভাই? 💋' },
        { min: 0.95, label: 'তুমি কি মানুষ? 😦' },
    ];

    const drawCanvas = document.getElementById('drawCanvas');
    const dctx = drawCanvas.getContext('2d');
    dctx.lineCap = 'round';
    dctx.lineJoin = 'round';
    dctx.strokeStyle = '#1C1B1F';
    dctx.lineWidth = 13;

    const paperCanvas = document.getElementById('paperCanvas');
    const pctx = paperCanvas.getContext('2d');

    function drawPaper(){
        const w = paperCanvas.width, h = paperCanvas.height;
        pctx.clearRect(0, 0, w, h);
        pctx.fillStyle = '#fffdf7';
        pctx.fillRect(0, 0, w, h);

        pctx.strokeStyle = '#E0362E';
        pctx.lineWidth = 2;
        pctx.beginPath();
        pctx.moveTo(34.5, 0);
        pctx.lineTo(34.5, h);
        pctx.stroke();

        pctx.strokeStyle = 'rgba(47,95,196,0.35)';
        pctx.lineWidth = 1;
        for (let y = 39.5; y < h; y += 39){
            pctx.beginPath();
            pctx.moveTo(0, y);
            pctx.lineTo(w, y);
            pctx.stroke();
        }
    }
    drawPaper();

    let drawing = false, lastX = 0, lastY = 0, hasDrawn = false;
    let totalPathLength = 0;

    function getPos(e){
        const rect = drawCanvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return {
            x: (t.clientX - rect.left) * (drawCanvas.width / rect.width),
            y: (t.clientY - rect.top) * (drawCanvas.height / rect.height)
        };
    }
    function strokeStart(e){
        e.preventDefault();
        drawing = true; hasDrawn = true;
        const p = getPos(e); lastX = p.x; lastY = p.y;
        dctx.beginPath();
        dctx.arc(p.x, p.y, dctx.lineWidth/2, 0, Math.PI*2);
        dctx.fillStyle = dctx.strokeStyle;
        dctx.fill();
    }
    function strokeMove(e){
        if (!drawing) return;
        e.preventDefault();
        const p = getPos(e);
        dctx.beginPath();
        dctx.moveTo(lastX, lastY);
        dctx.lineTo(p.x, p.y);
        dctx.stroke();
        totalPathLength += Math.hypot(p.x - lastX, p.y - lastY);
        lastX = p.x; lastY = p.y;
    }
    function strokeEnd(){ drawing = false; }

    drawCanvas.addEventListener('mousedown', strokeStart);
    drawCanvas.addEventListener('mousemove', strokeMove);
    window.addEventListener('mouseup', strokeEnd);
    drawCanvas.addEventListener('touchstart', strokeStart, { passive: false });
    drawCanvas.addEventListener('touchmove', strokeMove, { passive: false });
    drawCanvas.addEventListener('touchend', strokeEnd);

    function resetCanvas(){
        dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        hasDrawn = false;
        totalPathLength = 0;
        setHint('');
    }

    const hintEl = document.getElementById('hint');
    function setHint(text){ hintEl.textContent = text || '\u00A0'; }

    function getBoundingBox(sourceCanvas){
        const w = sourceCanvas.width, h = sourceCanvas.height;
        const sctx = sourceCanvas.getContext('2d');
        const data = sctx.getImageData(0, 0, w, h).data;

        let minX = w, minY = h, maxX = -1, maxY = -1;
        for (let y = 0; y < h; y++){
            for (let x = 0; x < w; x++){
                const alpha = data[(y * w + x) * 4 + 3];
                if (alpha > 10){
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }
        }
        if (maxX < 0) return null;
        return { minX, minY, maxX, maxY, w: maxX - minX + 1, h: maxY - minY + 1 };
    }

    function normalize(sourceCanvas, outSize, pad, bbox){
        const box = bbox || getBoundingBox(sourceCanvas);
        if (!box) return null;

        const scale = Math.min((outSize - pad*2) / box.w, (outSize - pad*2) / box.h);
        const dw = box.w * scale, dh = box.h * scale;

        const out = document.createElement('canvas');
        out.width = outSize; out.height = outSize;
        const octx = out.getContext('2d');
        octx.drawImage(sourceCanvas, box.minX, box.minY, box.w, box.h,
                        (outSize - dw)/2, (outSize - dh)/2, dw, dh);
        return out;
    }

    function toBlurredMask(canvas, size, blur, threshold){
        const b = document.createElement('canvas');
        b.width = size; b.height = size;
        const bctx = b.getContext('2d');
        bctx.filter = `blur(${blur}px)`;
        bctx.drawImage(canvas, 0, 0);
        const data = bctx.getImageData(0, 0, size, size).data;
        const mask = new Uint8Array(size * size);
        for (let i = 0; i < size * size; i++){
            mask[i] = data[i*4 + 3] > threshold ? 1 : 0;
        }
        return mask;
    }

    function iou(a, b){
        let inter = 0, union = 0;
        for (let i = 0; i < a.length; i++){
            const x = a[i], y = b[i];
            if (x || y) union++;
            if (x && y) inter++;
        }
        return union === 0 ? 0 : inter / union;
    }

    function overlapStats(userMask, refMask){
        let inter = 0, union = 0, refCount = 0;
        for (let i = 0; i < userMask.length; i++){
            const u = userMask[i], r = refMask[i];
            if (u || r) union++;
            if (u && r) inter++;
            if (r) refCount++;
        }
        const score = union === 0 ? 0 : inter / union;
        const recall = refCount === 0 ? 0 : inter / refCount;
        return { score, recall };
    }

    function getTier(score){
        let result = TIERS[0];
        for (const t of TIERS) if (score >= t.min) result = t;
        return result;
    }

    let refMasks = [];
    let decoyMasks = [];
    let refsReady = false;

    function renderGlyph(letter, fontCss, weight){
        const c = document.createElement('canvas');
        c.width = RAW; c.height = RAW;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `${weight} 215px ${fontCss}`;
        ctx.fillText(letter, RAW/2, RAW/2 + 8);
        return c;
    }

    async function initReferences(){
        try{
            await Promise.all(FONT_LIST.map(f =>
                document.fonts.load(`${f.weight} 215px ${f.css}`, LETTER)
            ));
            await document.fonts.ready;
        } catch(e){  }

        refMasks = FONT_LIST.map(f => {
            const raw = renderGlyph(LETTER, f.css, f.weight);
            const norm = normalize(raw, NORM, PAD);
            const mask = norm ? toBlurredMask(norm, NORM, BLUR, THRESH) : null;
            return { name: f.name, mask };
        }).filter(r => r.mask);

        decoyMasks = [];
        for (const letter of DECOY_LETTERS){
            for (const f of DECOY_FONTS){
                const raw = renderGlyph(letter, f.css, f.weight);
                const norm = normalize(raw, NORM, PAD);
                const mask = norm ? toBlurredMask(norm, NORM, BLUR, THRESH) : null;
                if (mask) decoyMasks.push({ letter, mask });
            }
        }

        refsReady = true;
    }

    const rankLabel = document.getElementById('rankLabel');
    const closestStyle = document.getElementById('closestStyle');
    const mainCard = document.getElementById('main');
    const resultCard = document.getElementById('result');

    function scoreDrawing(bbox){
        const norm = normalize(drawCanvas, NORM, PAD, bbox);
        if (!norm) return null;
        const userMask = toBlurredMask(norm, NORM, BLUR, THRESH);

        let best = { name: null, score: 0, recall: 0 };
        for (const r of refMasks){
            const stats = overlapStats(userMask, r.mask);
            if (stats.score > best.score) best = { name: r.name, score: stats.score, recall: stats.recall };
        }

        let bestDecoy = { letter: null, score: 0 };
        for (const d of decoyMasks){
            const s = iou(userMask, d.mask);
            if (s > bestDecoy.score) bestDecoy = { letter: d.letter, score: s };
        }

        return { best, bestDecoy };
    }

    function computeAdjustedScore(best, bestDecoy){
        let score = best.score;
        const afterSelf = score;

        const coverageFactor = Math.min(1, best.recall / TARGET_RECALL);
        score *= coverageFactor;
        const afterCoverage = score;

        const decoyDeficit = bestDecoy.score - best.score;
        if (decoyDeficit > 0){
            score *= Math.max(0, 1 - decoyDeficit * DECOY_PENALTY_STRENGTH);
        }
        const afterDecoy = score;

        score = Math.max(0, Math.min(1, score));
        const final = Math.pow(score, HARSHNESS_CURVE);

        return { final, breakdown: { afterSelf, afterCoverage, afterDecoy } };
    }

    function EvaluateDrawing(){
        if (!refsReady){ setHint('একটু অপেক্ষা করো, লোড হচ্ছে…'); return; }

        const bbox = getBoundingBox(drawCanvas);
        const barelyDrawn = !bbox || !hasDrawn ||
                             totalPathLength < MIN_PATH_LENGTH ||
                             bbox.w < MIN_BBOX_SIZE || bbox.h < MIN_BBOX_SIZE;

        let finalScore = 0;
        let matchedFont = null;

        if (!barelyDrawn){
            const result = scoreDrawing(bbox);
            if (result){
                const adj = computeAdjustedScore(result.best, result.bestDecoy);
                finalScore = adj.final;
                matchedFont = result.best.name;
                if (DEBUG){
                    const b = adj.breakdown;
                    console.log(
                        `self: ${(b.afterSelf*100).toFixed(1)}% (${result.best.name})  |  recall: ${(result.best.recall*100).toFixed(1)}%` +
                        `\n  after coverage penalty: ${(b.afterCoverage*100).toFixed(1)}%` +
                        `\n  after decoy penalty (${result.bestDecoy.letter} @ ${(result.bestDecoy.score*100).toFixed(1)}%): ${(b.afterDecoy*100).toFixed(1)}%` +
                        `\n  after harshness curve: ${(finalScore*100).toFixed(1)}%`
                    );
                }
            }
        }

        const tier = getTier(finalScore);
        rankLabel.textContent = tier.label;
        closestStyle.textContent = matchedFont ? `(${matchedFont} স্টাইলের সাথে সবচেয়ে বেশি মিলেছে)` : '';
        setHint('');

        mainCard.style.display = 'none';
        resultCard.style.display = 'none';
        void resultCard.offsetWidth;
        resultCard.style.display = 'block';
    }

    function resetGame(){
        resultCard.style.display = 'none';
        mainCard.style.display = 'block';
        resetCanvas();
    }

    initReferences();
</script>
